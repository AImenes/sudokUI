<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- The browser tests' fonts as GitHub's runner has them: no Inter, so the
       app's system-ui stack falls back to DejaVu Sans, which is wider. A
       layout that fits with Inter can overflow here (the top bar did, at
       580 px). To run the browser tests as CI does:
       FONTCONFIG_FILE=tests/e2e/ci-fonts.conf CI=1 npx playwright test -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <!-- like a GitHub runner, which has no Inter: the generic families resolve to DejaVu -->
  <selectfont><rejectfont><pattern><patelt name="family"><string>Inter</string></patelt></pattern></rejectfont></selectfont>
  <selectfont><rejectfont><pattern><patelt name="family"><string>Inter Display</string></patelt></pattern></rejectfont></selectfont>
  <alias binding="strong"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="strong"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
